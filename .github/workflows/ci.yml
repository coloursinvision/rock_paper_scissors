name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, macos-15-intel, windows-latest]
    defaults:
      run:
        shell: bash -el {0}
    env:
      CONDA_SAFETY_CHECKS: enabled
      CONDA_EXTRA_SAFETY_CHECKS: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: conda-incubator/setup-miniconda@be893c923ea9cf1cf7cd510fbdde27c7e18cbdcb # v4.1.0
        with:
          miniforge-version: 26.9.4-1
          activate-environment: ""
          auto-activate: "false"
          conda-remove-defaults: "true"
      - name: Create environment from lock file
        run: conda create --yes --name ci --file conda-lock.yml
      - name: Install project
        run: |
          conda activate ci
          python -m pip install --no-deps --no-build-isolation --no-index --editable .
      - name: Check link scripts
        run: |
          conda activate ci
          python scripts/check_link_scripts.py "$CONDA_PREFIX"
      - name: Lint
        run: |
          conda activate ci
          ruff check .
          ruff format --check .
      - name: Type check
        run: |
          conda activate ci
          mypy
      - name: Test
        run: |
          conda activate ci
          coverage run -m pytest
          coverage report

  hygiene:
    name: hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash -el {0}
    env:
      CONDA_SAFETY_CHECKS: enabled
      CONDA_EXTRA_SAFETY_CHECKS: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: conda-incubator/setup-miniconda@be893c923ea9cf1cf7cd510fbdde27c7e18cbdcb # v4.1.0
        with:
          miniforge-version: 26.9.4-1
          activate-environment: ""
          auto-activate: "false"
          conda-remove-defaults: "true"
      - name: Create environment from lock file
        run: conda create --yes --name ci --file conda-lock.yml
      - name: Run pre-commit hooks
        run: |
          conda activate ci
          pre-commit run --all-files --show-diff-on-failure
      - name: Scan history for secrets
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          curl -fsSL -o "$RUNNER_TEMP/$archive" "$url"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --verbose
