name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, macos-15-intel, windows-latest]
    defaults:
      run:
        shell: bash -el {0}
    env:
      CONDA_SAFETY_CHECKS: enabled
      CONDA_EXTRA_SAFETY_CHECKS: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: conda-incubator/setup-miniconda@be893c923ea9cf1cf7cd510fbdde27c7e18cbdcb # v4.1.0
        with:
          miniforge-version: 26.9.4-1
          activate-environment: ""
          auto-activate: "false"
          conda-remove-defaults: "true"
      - name: Create environment from lock file
        run: conda create --yes --name ci --file conda-lock.yml
      - name: Install project
        run: |
          conda activate ci
          python -m pip install --no-deps --no-build-isolation --no-index --editable .
      - name: Check link scripts
        run: |
          conda activate ci
          python scripts/check_link_scripts.py "$CONDA_PREFIX"
      - name: Lint
        run: |
          conda activate ci
          ruff check .
          ruff format --check .
      - name: Type check
        run: |
          conda activate ci
          mypy
      - name: Test
        run: |
          conda activate ci
          coverage run -m pytest
          coverage report
