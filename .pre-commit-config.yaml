minimum_pre_commit_version: "4.4.0"
default_install_hook_types: [pre-commit, commit-msg, pre-push]
default_stages: [pre-commit]
repos:
  - repo: local
    hooks:
      - id: trailing-whitespace
        name: trim trailing whitespace
        entry: trailing-whitespace-fixer
        language: unsupported
        types: [text]
      - id: end-of-file-fixer
        name: fix end of files
        entry: end-of-file-fixer
        language: unsupported
        types: [text]
      - id: mixed-line-ending
        name: mixed line ending
        entry: mixed-line-ending
        language: unsupported
        types: [text]
        args: [--fix=lf]
      - id: fix-byte-order-marker
        name: fix utf-8 byte order marker
        entry: fix-byte-order-marker
        language: unsupported
        types: [text]
      - id: check-case-conflict
        name: check for case conflicts
        entry: check-case-conflict
        language: unsupported
      - id: check-added-large-files
        name: check for added large files
        entry: check-added-large-files
        language: unsupported
      - id: check-merge-conflict
        name: check for merge conflicts
        entry: check-merge-conflict
        language: unsupported
        types: [text]
      - id: check-symlinks
        name: check for broken symlinks
        entry: check-symlinks
        language: unsupported
        types: [symlink]
      - id: check-yaml
        name: check yaml
        entry: check-yaml
        language: unsupported
        types: [yaml]
      - id: check-toml
        name: check toml
        entry: check-toml
        language: unsupported
        types: [toml]
      - id: debug-statements
        name: debug statements (python)
        entry: debug-statement-hook
        language: unsupported
        types: [python]
      - id: name-tests-test
        name: python tests naming
        entry: name-tests-test
        language: unsupported
        files: '(^|/)tests/.+\.py$'
        args: [--pytest-test-first]
      - id: detect-private-key
        name: detect private key
        entry: detect-private-key
        language: unsupported
        types: [text]
      - id: check-text
        name: check for characters outside tab, line feed and printable ASCII
        entry: python scripts/check_text.py
        language: unsupported
        types: [text]
      - id: check-commit-message
        name: check the commit message
        entry: python scripts/check_commit_message.py
        language: unsupported
        stages: [commit-msg]
      - id: ruff-check
        name: ruff check
        entry: ruff check .
        language: unsupported
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      - id: ruff-format
        name: ruff format check
        entry: ruff format --check .
        language: unsupported
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      - id: mypy
        name: mypy
        entry: mypy
        language: unsupported
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      - id: pytest
        name: tests under coverage
        entry: coverage run -m pytest
        language: unsupported
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      - id: coverage-report
        name: coverage report
        entry: coverage report
        language: unsupported
        pass_filenames: false
        always_run: true
        stages: [pre-push]
